<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serpiente 20x20</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { margin-bottom: 8px; }
  #score { font-size: 1.2rem; margin-bottom: 12px; }
  #board {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    grid-template-rows: repeat(20, 1fr);
    width: min(90vw, 400px);
    height: min(90vw, 400px);
    border: 2px solid #4caf50;
    background: #222;
    position: relative;
  }
  .cell { width: 100%; height: 100%; }
  .snake { background: #4caf50; border-radius: 3px; }
  .head { background: #8bc34a; }
  .food { background: #f44336; border-radius: 50%; }
  #overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
  }
  #overlay.show { display: flex; }
  #overlay button {
    margin-top: 8px;
    padding: 8px 16px;
    cursor: pointer;
  }
  #help { margin-top: 12px; color: #aaa; font-size: 0.9rem; text-align: center; }
</style>
</head>
<body>
  <h1>Serpiente</h1>
  <div id="score">Puntaje: 0 | Máximo: 0</div>
  <div id="board">
    <div id="overlay">
      <h2>Game Over</h2>
      <p id="finalScore">Puntaje: 0</p>
      <p id="highScore">Máximo: 0</p>
      <p>Presiona Espacio para reiniciar</p>
      <button id="restartBtn">Reiniciar</button>
    </div>
  </div>
  <p id="help">Usa las flechas para moverte. Espacio para reiniciar.</p>

<script>
  const ROWS = 20;
  const COLS = 20;
  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const finalScoreEl = document.getElementById('finalScore');
  const highScoreEl = document.getElementById('highScore');
  const restartBtn = document.getElementById('restartBtn');

  const HIGH_KEY = 'snakeHighScore';
  const BASE_SPEED = 150;
  const MIN_SPEED = 60;
  const SPEED_STEP = 15;

  let cells = [];
  let snake, direction, nextDirection, food, score, gameOver, loop;
  let highScore = parseInt(localStorage.getItem(HIGH_KEY) || '0', 10);
  let speed, foodsEaten;

  function createBoard() {
    for (let i = 0; i < ROWS * COLS; i++) {
      const div = document.createElement('div');
      div.className = 'cell';
      board.appendChild(div);
      cells.push(div);
    }
    // Mantener overlay al frente
    board.appendChild(overlay);
  }

  function idx(x, y) {
    return y * COLS + x;
  }

  function placeFood() {
    while (true) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      if (!snake.some(s => s.x === x && s.y === y)) {
        food = { x, y };
        break;
      }
    }
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    foodsEaten = 0;
    speed = BASE_SPEED;
    gameOver = false;
    placeFood();
    overlay.classList.remove('show');
    updateScore();
    startLoop();
    draw();
  }

  function startLoop() {
    clearInterval(loop);
    loop = setInterval(tick, speed);
  }

  function saveHigh() {
    if (score > highScore) {
      highScore = score;
      localStorage.setItem(HIGH_KEY, String(highScore));
    }
  }

  function updateScore() {
    saveHigh();
    scoreEl.textContent = 'Puntaje: ' + score + ' | Máximo: ' + highScore;
  }

  function tick() {
    if (gameOver) return;
    direction = nextDirection;
    let head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Atravesar paredes: aparecer del otro lado
    if (head.x < 0) head.x = COLS - 1;
    else if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    else if (head.y >= ROWS) head.y = 0;

    // Colisión con cuerpo
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    // Comer
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      foodsEaten++;
      // Aumenta velocidad cada 5 comidas (50 pts): 1 comida = 10 pts
      if (foodsEaten % 5 === 0 && speed > MIN_SPEED) {
        speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
        startLoop();
      }
      updateScore();
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    for (const c of cells) c.className = 'cell';
    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      cells[idx(s.x, s.y)].className = 'cell ' + (i === 0 ? 'snake head' : 'snake');
    }
    cells[idx(food.x, food.y)].classList.add('food');
  }

  function endGame() {
    gameOver = true;
    clearInterval(loop);
    saveHigh();
    finalScoreEl.textContent = 'Puntaje: ' + score;
    highScoreEl.textContent = 'Máximo: ' + highScore;
    scoreEl.textContent = 'Puntaje: ' + score + ' | Máximo: ' + highScore;
    overlay.classList.add('show');
  }

  document.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
      e.preventDefault();
    }
    if (e.key === ' ' && gameOver) {
      reset();
      return;
    }
    switch (e.key) {
      case 'ArrowUp':
        if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
        break;
      case 'ArrowDown':
        if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
        break;
      case 'ArrowLeft':
        if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
        break;
      case 'ArrowRight':
        if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
        break;
    }
  });

  restartBtn.addEventListener('click', reset);

  createBoard();
  reset();
</script>
</body>
</html>
